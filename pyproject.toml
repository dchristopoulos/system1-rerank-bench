[project]
name = "system1-rerank-bench"
version = "0.1.0"
description = "Decision models, cross-encoders and an LLM as rerankers on BEIR"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dimitris Christopoulos" }]
requires-python = ">=3.12,<3.15"
dependencies = ["numpy (>=2.0,<3.0)"]

[tool.poetry]
packages = [{ include = "rerank_bench" }]

[tool.poetry.group.models]
optional = true

[tool.poetry.group.hosted]
optional = true

[dependency-groups]
dev = ["ruff (==0.16.10)"]
models = ["sentence-transformers (==6.1.0)", "laya (==0.3.23)"]
hosted = ["openai (>=3.24.0,<4.0.0)"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
