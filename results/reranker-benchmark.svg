<text x="978" y="144" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">Per query</text>
<text x="48" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Jev 1.13<tspan font-weight="400" fill="#52514e" font-size="13">  hosted decision model</tspan></text>
<text x="978" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">0.65 to 1.7 s · $1.05 per 1,000</text>
<text x="48" y="234" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">GPT-5.6 Luna<tspan font-weight="400" fill="#52514e" font-size="13">  LLM, ranks the whole list</tspan></text>
<text x="978" y="234" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">9.1 s · $3.77 per 1,000</text>
<text x="48" y="280" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Qwen3-Reranker-4B<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker</tspan></text>
<text x="978" y="280" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">31 s on a laptop GPU</text>
<text x="48" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Qwen3-Reranker-0.6B<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker</tspan></text>
<text x="978" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">5.7 s on a laptop GPU</text>
<text x="48" y="372" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">BGE-reranker-v2-m3<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker, 568M</tspan></text>
<text x="978" y="372" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">3.1 s on a laptop GPU</text>
<text x="48" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Ettin reranker 150M<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker</tspan></text>
<text x="978" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">1.3 s on a laptop GPU</text>
<text x="48" y="464" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">No reranker<tspan font-weight="400" fill="#52514e" font-size="13">  hybrid search only</tspan></text>
<text x="978" y="464" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">baseline</text>
<text x="48" y="510" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">MiniLM-L6<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker, 22M</tspan></text>
<text x="978" y="510" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">0.15 s on a laptop GPU</text>
<text x="48" y="556" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">BGE-reranker-base<tspan font-weight="400" fill="#52514e" font-size="13">  open reranker, 278M</tspan></text>
<text x="978" y="556" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">0.92 s on a laptop GPU</text>
<text x="48" y="602" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Laya 421M<tspan font-weight="400" fill="#52514e" font-size="13">  open decision model</tspan></text>
<text x="978" y="602" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">3.9 s on a laptop GPU</text>
<text x="48" y="648" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8983">Decision models use one four-level relevance rubric. Open models ran on an Apple M4 Pro, which is not their serving hardware. Hosted times include the network.</text>
<text x="48" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8983">Jev: three requests in parallel to in sequence. Luna ran on a ChatGPT plan route; its price is list API price for the measured tokens. See the report for intervals.</text>
</svg>
