<text x="1024" y="762.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">open</text>
<text x="56" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">BGE-reranker-v2-m3<tspan font-weight="400" fill="#52514e" font-size="22">  open reranker, 568M</tspan></text>
