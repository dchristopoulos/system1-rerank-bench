<text x="56" y="1262" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a8983">Dashed line: no reranker. Mean of SciFact and NFCorpus (BEIR), 100 test queries each.</text>
<text x="56" y="1287" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a8983">The top three could not be separated. Jev time: three requests in parallel to in sequence.</text>
<text x="56" y="1312" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a8983">LLM time is a ChatGPT plan route; its price is list API price for the measured tokens.</text>
<text x="56" y="1337" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a8983">*Open models ran on an Apple M4 Pro laptop GPU, not their serving hardware.</text>
</svg>
