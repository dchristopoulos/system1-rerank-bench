<text x="872" y="980.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">1.3 s*</text>
<text x="1024" y="980.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">open</text>
<text x="56" y="1048.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">No reranker<tspan font-weight="400" fill="#52514e" font-size="22">  hybrid search only</tspan></text>
<path d="M56,1060.0 H480.3 Q486.3,1060.0 486.3,1066.0 V1092.0 Q486.3,1098.0 480.3,1098.0 H56 Z" fill="#d3d2cc"/>
