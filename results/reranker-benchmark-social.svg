<text x="872" y="871.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">3.1 s*</text>
<text x="1024" y="871.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">open</text>
<text x="56" y="939.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">Ettin reranker 150M<tspan font-weight="400" fill="#52514e" font-size="22">  open reranker</tspan></text>
<path d="M56,951.0 H487.4 Q493.4,951.0 493.4,957.0 V983.0 Q493.4,989.0 487.4,989.0 H56 Z" fill="#9c9b95"/>
<line x1="486.3" x2="486.3" y1="945.0" y2="995.0" stroke="#8a8983" stroke-width="2" stroke-dasharray="5 5"/>
