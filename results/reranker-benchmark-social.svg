<text x="1024" y="919.4" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#52514e" text-anchor="end">open</text>
<text x="56" y="975.3" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">Ettin reranker 150M<tspan font-weight="400" fill="#52514e" font-size="22">  open reranker</tspan></text>
