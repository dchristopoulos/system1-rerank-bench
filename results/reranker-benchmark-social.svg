<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d">
<title id="t">Reranking quality, time and price by model</title>
<desc id="d">Average nDCG at 10 over SciFact and NFCorpus for each reranker, with time and price per query.</desc>
<rect width="1080" height="1350" fill="#fcfcfb"/>
<text x="56" y="92" font-family="Helvetica, Arial, sans-serif" font-size="55" font-weight="700" fill="#0b0b0b">A decision model reranked</text>
<text x="56" y="156" font-family="Helvetica, Arial, sans-serif" font-size="55" font-weight="700" fill="#0b0b0b">as well as an LLM,</text>
<text x="56" y="220" font-family="Helvetica, Arial, sans-serif" font-size="55" font-weight="700" fill="#2a78d6">3.6x cheaper, 5 to 14x faster.</text>
<text x="56" y="272" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#52514e">Each model reorders the same 50 search results per query.</text>
<text x="56" y="304" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#52514e">Bars: ranking quality (nDCG@10), higher is better. <tspan fill="#2a78d6" font-weight="700">Blue</tspan>: decision models.</text>
<text x="872" y="350" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#52514e" text-anchor="end">time</text>
<text x="1024" y="350" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#52514e" text-anchor="end">$ / 1,000</text>
<text x="56" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">Jev 1.13<tspan font-weight="400" fill="#52514e" font-size="22">  hosted decision model</tspan></text>
<path d="M56,406.0 H549.7 Q555.7,406.0 555.7,412.0 V438.0 Q555.7,444.0 549.7,444.0 H56 Z" fill="#2a78d6"/>
<line x1="486.3" x2="486.3" y1="400.0" y2="450.0" stroke="#8a8983" stroke-width="2" stroke-dasharray="5 5"/>
<text x="567.7" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="9" paint-order="stroke">0.62</text>
<text x="872" y="435.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b0b0b" text-anchor="end">0.65 to 1.7 s</text>
<text x="1024" y="435.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b0b0b" text-anchor="end">$1.05</text>
<text x="56" y="503.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="8" paint-order="stroke">GPT-5.6 Luna<tspan font-weight="400" fill="#52514e" font-size="22">  LLM, ranks the whole list</tspan></text>
<path d="M56,515.0 H545.2 Q551.2,515.0 551.2,521.0 V547.0 Q551.2,553.0 545.2,553.0 H56 Z" fill="#52514e"/>
<line x1="486.3" x2="486.3" y1="509.0" y2="559.0" stroke="#8a8983" stroke-width="2" stroke-dasharray="5 5"/>
<text x="563.2" y="545.0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="9" paint-order="stroke">0.62</text>
<text x="872" y="544.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b0b0b" text-anchor="end">9.1 s</text>
<text x="1024" y="544.0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b0b0b" text-anchor="end">$3.77</text>
